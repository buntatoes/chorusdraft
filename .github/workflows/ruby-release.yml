name: Legacy Ruby checks

on:
  pull_request:
    branches: [main-ruby]
    paths:
      - '.ruby-version'
      - 'bot'
      - 'bluesky/**'
      - 'lib/**/*.rb'
      - 'mastodon/**'
      - 'scripts/build_release.rb'
      - 'scripts/verify_release.py'
      - 'setup.rb'
      - 'test/**/*_test.rb'
      - '.github/workflows/ruby-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruby-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      - name: Build the six release archives
        run: ruby scripts/build_release.rb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ruby-release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  native:
    name: Native checks (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
      - name: Install test dependency
        run: gem install minitest --version 6.0.0 --no-document
      - name: Report native runtime
        run: ruby -e 'puts RUBY_DESCRIPTION; puts RUBY_PLATFORM'
      - name: Source safety and command tests
        run: ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require_relative file }'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ruby-release-archives
          path: dist
      - name: Test extracted release packages and native launchers
        run: python scripts/verify_release.py
