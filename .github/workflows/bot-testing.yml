name: Elixir desktop checks

on:
  push:
    branches: [bot-testing]
  pull_request:
    branches: [bot-testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '25.3'
          elixir-version: '1.15.8'
      - name: Elixir dependencies and tests
        working-directory: elixir
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          git diff --exit-code -- mix.lock
          mix format --check-formatted
          mix test --warnings-as-errors
      - name: Build Elixir package
        working-directory: elixir
        shell: bash
        run: MIX_ENV=prod mix run scripts/build_release.exs
      - name: Elixir native package checks
        if: runner.os != 'Windows'
        working-directory: elixir
        run: ./scripts/check_packages.sh
      - name: Elixir Windows package checks
        if: runner.os == 'Windows'
        working-directory: elixir
        run: ./scripts/check_packages.ps1
      - name: Desktop build dependencies
        run: |
          python -m pip install -r launcher/requirements-build.txt
          npm ci --prefix desktop
          npm run build --prefix desktop
      - name: Terminal bridge tests
        run: python launcher/test_gui.py
      - name: Desktop tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          export XDG_DATA_HOME="$(mktemp -d)"
          export XDG_CURRENT_DESKTOP=GNOME
          export CHORUSDRAFT_TEST_KEYRING=1
          dbus-run-session -- bash -c 'printf "%s" "fixture-keyring-password" | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a npm test --prefix desktop'
      - name: Isolated macOS test keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p fixture-keyring-password "$RUNNER_TEMP/chorusdraft.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/chorusdraft.keychain-db"
          security unlock-keychain -p fixture-keyring-password "$RUNNER_TEMP/chorusdraft.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/chorusdraft.keychain-db"
      - name: Desktop tests (macOS and Windows)
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: npm test --prefix desktop
      - name: Build desktop launcher
        run: python scripts/build_gui.py
      - name: Build and test combined package
        run: |
          python scripts/build_bundle.py
      - name: Combined desktop and launcher checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_launcher.py
        env:
          CHORUSDRAFT_TEST_SANDBOX: '1'
      - name: Combined desktop and launcher checks (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/verify_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: chorusdraft-testing-${{ matrix.os }}
          path: dist/chorusdraft-v0.51.4-testing-*
          if-no-files-found: error
          retention-days: 14
