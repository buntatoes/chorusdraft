name: Combined bot checks

on:
  push:
    branches: [bot-testing]
  pull_request:
    branches: [bot-testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
      - run: ruby scripts/build_release.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-testing-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
  native:
    needs: ruby-packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '25.3'
          elixir-version: '1.15.8'
      - name: Ruby source tests
        run: |
          gem install minitest --version 6.0.0 --no-document
          ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require_relative file }'
      - uses: actions/download-artifact@v4
        with:
          name: ruby-testing-packages
          path: dist
      - name: Ruby native packages
        run: python scripts/verify_release.py
      - name: Elixir dependencies and tests
        working-directory: elixir
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          git diff --exit-code -- mix.lock
          mix format --check-formatted
          mix test --warnings-as-errors
      - name: Build Elixir package
        working-directory: elixir
        shell: bash
        run: MIX_ENV=prod mix run scripts/build_release.exs
      - name: Elixir native package checks
        if: runner.os != 'Windows'
        working-directory: elixir
        run: ./scripts/check_packages.sh
      - name: Elixir Windows package checks
        if: runner.os == 'Windows'
        working-directory: elixir
        run: ./scripts/check_packages.ps1
      - name: Desktop build dependencies
        run: |
          python -m pip install -r launcher/requirements-build.txt
          npm ci --prefix desktop
          npm run build --prefix desktop
      - name: Terminal bridge tests
        run: python launcher/test_gui.py
      - name: Desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test --prefix desktop
      - name: Desktop tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm test --prefix desktop
      - name: Build desktop launcher
        run: python scripts/build_gui.py
      - name: Build and test combined package
        run: |
          python scripts/build_bundle.py
      - name: Combined desktop and launcher checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/verify_launcher.py
        env:
          CHORUSDRAFT_TEST_SANDBOX: '1'
      - name: Combined desktop and launcher checks (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/verify_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: chorusdraft-testing-${{ matrix.os }}
          path: dist/chorusdraft-v0.51.3-testing-*
          if-no-files-found: error
          retention-days: 14
