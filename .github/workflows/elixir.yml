name: Elixir checks

on:
  push:
    branches: [elixir-experimental, codex/elixir-complete]
    paths: ['elixir/**', '.github/workflows/elixir.yml']
  pull_request:
    branches: [elixir-experimental]
    paths: ['elixir/**', '.github/workflows/elixir.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '25.3'
          elixir-version: '1.15.8'
      - name: Dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          git diff -- mix.lock
      - name: Offline regression tests
        run: mix test --warnings-as-errors
      - name: Build the Linux escript
        run: |
          MIX_ENV=prod mix escript.build
          ./chorusdraft bluesky --help
          ./chorusdraft mastodon --help
      - name: Package and installation checks
        run: |
          mkdir -p bluesky/data bluesky/logs
          printf '%s' 'PACKAGE_EXCLUSION_SENTINEL' > bluesky/.env
          printf '%s' 'PACKAGE_EXCLUSION_SENTINEL' > bluesky/data/state.json
          printf '%s' 'PACKAGE_EXCLUSION_SENTINEL' > bluesky/logs/runtime.log
          MIX_ENV=prod mix run scripts/build_release.exs
          ./scripts/check_packages.sh
      - name: Formatting
        if: always()
        run: mix format --check-formatted || { mix format; git diff -- .; exit 1; }
